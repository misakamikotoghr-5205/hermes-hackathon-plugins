function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function renderScene(t) {
  const scene = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
  captionText.textContent = scene.caption;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 1280, 720);
  grad.addColorStop(0, "#070a12");
  grad.addColorStop(1, "#0f172a");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1280, 720);

  // Subtle grid
  ctx.strokeStyle = "rgba(148, 163, 184, 0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x < 1280; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
  }
  for (let y = 0; y < 720; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
  }

  // Header Pill
  ctx.fillStyle = scene.pillColor + "22";
  ctx.strokeStyle = scene.pillColor;
  ctx.lineWidth = 1.5;
  roundRect(ctx, 48, 34, 340, 30, 15);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = scene.pillColor;
  ctx.font = "bold 13px Inter, sans-serif";
  ctx.fillText(scene.chapter, 66, 54);

  // Top-right clock badge
  ctx.fillStyle = "#1e293b";
  roundRect(ctx, 1080, 34, 152, 32, 8);
  ctx.fill();
  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 14px monospace";
  ctx.fillText(`⏱ ${formatTime(t)} / 01:15`, 1098, 55);

  // Main Title & Subtitle
  ctx.fillStyle = "#f8fafc";
  ctx.font = "bold 28px Inter, sans-serif";
  ctx.fillText(scene.title, 48, 104);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "16px Inter, sans-serif";
  ctx.fillText(scene.subtitle, 48, 134);

  // Left Terminal Window
  const termX = 48, termY = 162, termW = 790, termH = 440;
  ctx.fillStyle = "#090d16";
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 1.5;
  roundRect(ctx, termX, termY, termW, termH, 12);
  ctx.fill(); ctx.stroke();

  // Terminal Header
  ctx.fillStyle = "#131c2e";
  roundRect(ctx, termX, termY, termW, 38, 12);
  ctx.fill();

  // Traffic dots
  const dots = ["#ef4444", "#f59e0b", "#22c55e"];
  dots.forEach((c, idx) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(termX + 22 + idx * 18, termY + 19, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "bold 13px monospace";
  ctx.fillText(scene.terminalTitle, termX + 86, termY + 24);

  // Render Terminal Lines with typewriter reveal
  ctx.font = "14px 'Consolas', 'Courier New', monospace";
  let lineY = termY + 72;
  scene.lines.forEach(l => {
    if (t >= l.t) {
      const elapsed = t - l.t;
      const chars = Math.min(l.text.length, Math.floor(elapsed * 95));
      const visible = l.text.slice(0, chars);
      ctx.fillStyle = l.color;
      // Wrap if > 86 chars
      if (visible.length <= 86) {
        ctx.fillText(visible, termX + 22, lineY);
        lineY += 36;
      } else {
        ctx.fillText(visible.slice(0, 86), termX + 22, lineY);
        ctx.fillText("   " + visible.slice(86), termX + 22, lineY + 22);
        lineY += 54;
      }
    }
  });

  // Right Architecture Cards
  const cardX = 862, cardW = 370;
  scene.cards.forEach((c, i) => {
    const cardY = 162 + i * 150;
    ctx.fillStyle = c.active ? "#111c33" : "#0b1120";
    ctx.strokeStyle = c.active ? scene.pillColor : "#1e293b";
    ctx.lineWidth = c.active ? 2 : 1;
    roundRect(ctx, cardX, cardY, cardW, 134, 12);
    ctx.fill(); ctx.stroke();

    // Tag pill
    ctx.fillStyle = scene.pillColor + "28";
    roundRect(ctx, cardX + 18, cardY + 16, 175, 24, 6);
    ctx.fill();
    ctx.fillStyle = scene.pillColor;
    ctx.font = "bold 11px Inter, sans-serif";
    ctx.fillText(c.tag, cardX + 28, cardY + 32);

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 16px Inter, sans-serif";
    ctx.fillText(c.title, cardX + 18, cardY + 66);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "13px Inter, sans-serif";
    const words = c.desc.split(" ");
    let line1 = "", line2 = "";
    words.forEach(w => {
      if ((line1 + " " + w).length < 46) line1 += (line1 ? " " : "") + w;
      else line2 += (line2 ? " " : "") + w;
    });
    ctx.fillText(line1, cardX + 18, cardY + 92);
    if (line2) ctx.fillText(line2, cardX + 18, cardY + 112);
  });

  // Bottom Subtitle Bar inside Canvas (so exported video includes subtitles!)
  ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
  ctx.strokeStyle = "#334155";
  roundRect(ctx, 48, 622, 1184, 58, 10);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "15px Inter, sans-serif";
  ctx.fillText("💬 " + scene.caption, 68, 656);

  // Progress bar at very bottom of canvas
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 712, 1280, 8);
  ctx.fillStyle = scene.pillColor;
  ctx.fillRect(0, 712, (t / DURATION) * 1280, 8);
}

function loop(now) {
  const dt = (now - lastFrameTs) / 1000;
  lastFrameTs = now;
  if (isPlaying) {
    currentTime += dt;
    if (currentTime >= DURATION) {
      currentTime = DURATION;
      isPlaying = false;
      playPauseBtn.textContent = "▶ Play";
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }
    scrubber.value = currentTime;
    timeLabel.textContent = `${formatTime(currentTime)} / 01:15`;
  }
  renderScene(currentTime);
  requestAnimationFrame(loop);
}

playPauseBtn.addEventListener('click', () => {
  if (currentTime >= DURATION) currentTime = 0;
  isPlaying = !isPlaying;
  playPauseBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
});

restartBtn.addEventListener('click', () => {
  currentTime = 0;
  isPlaying = true;
  playPauseBtn.textContent = "⏸ Pause";
});

scrubber.addEventListener('input', (e) => {
  currentTime = parseFloat(e.target.value);
  timeLabel.textContent = `${formatTime(currentTime)} / 01:15`;
  renderScene(currentTime);
});

document.querySelectorAll('.chapter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTime = parseFloat(btn.dataset.t);
    isPlaying = true;
    playPauseBtn.textContent = "⏸ Pause";
  });
});

// WebM Video Export via MediaRecorder
let mediaRecorder = null;
let recordedChunks = [];

recordBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }
  recordedChunks = [];
  currentTime = 0;
  isPlaying = true;
  playPauseBtn.textContent = "⏸ Pause";
  const stream = canvas.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4000000 });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = () => {
    recordBtn.classList.remove('recording');
    recordBtn.textContent = "⏺ Export 75s Video (.webm)";
    const blob = new Blob(recordedChunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hermes-hackathon-plugins-demo-75s.webm';
    a.click();
  };
  mediaRecorder.start(200);
  recordBtn.classList.add('recording');
  recordBtn.textContent = "⏹ Stop & Download (.webm)";
});

requestAnimationFrame(loop);
</script>
</body>
</html>
